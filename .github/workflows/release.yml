name: release

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream kube2iam tag to mirror. Defaults to latest upstream release."
        required: false
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.discover.outputs.tag }}
      should_release: ${{ steps.discover.outputs.should_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Discover release tag
        id: discover
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_TAG}" ]; then
            tag="${INPUT_TAG}"
          else
            tag="$(./scripts/latest-upstream-tag.sh)"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release ${tag} already exists; skipping."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Release ${tag} does not exist; building."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: discover
    if: needs.discover.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.2"

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          install-only: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Install build tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y jq
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sudo sh -s -- -b /usr/local/bin

      - name: Build, sign, and publish release assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_COMMITISH: ${{ github.sha }}
        run: |
          set -euo pipefail
          make release TAG="${{ needs.discover.outputs.tag }}"
